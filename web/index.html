<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ChapterBrake</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/sortable.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CB</span>
        <span>
          <strong>ChapterBrake</strong>
          <small>LOCAL ENCODE QUEUE</small>
        </span>
      </div>
      <div class="topbar-status">
        <span id="connection-status" class="connection pending">接続中</span>
        <span id="global-status" class="global-status">状態を取得中…</span>
        <button class="button small secondary" type="button" data-action="new-job">新しいジョブ</button>
        <button class="icon-button" type="button" data-action="open-settings" aria-label="設定を開く">⚙</button>
      </div>
    </header>

    <div id="alert-region" class="alert-region" aria-live="assertive"></div>

    <div class="workspace">
      <main id="main" class="main-panel" tabindex="-1" aria-live="polite"></main>
      <aside class="queue-rail" aria-label="キュー概要">
        <div class="rail-header">
          <div>
            <p class="eyebrow">QUEUE</p>
            <h2>実行キュー</h2>
          </div>
          <span id="queue-count" class="rail-count">0</span>
        </div>
        <div id="queue-summary" class="queue-summary"></div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="job-dialog" class="modal-dialog">
      <div id="job-dialog-content"></div>
    </dialog>
    <dialog id="settings-dialog" class="modal-dialog settings-dialog">
      <form id="settings-form">
        <div class="modal-header">
          <div><p class="eyebrow">SETTINGS</p><h2>ChapterBrake設定</h2></div>
          <button class="icon-button" type="button" data-action="close-settings" aria-label="設定を閉じる">×</button>
        </div>
        <div class="form-grid">
          <div class="field full"><label for="settings-input">入力ディレクトリ</label><input id="settings-input" name="input_directory" type="text" required></div>
          <div class="field full"><label for="settings-output">出力ディレクトリ</label><input id="settings-output" name="output_directory" type="text" required></div>
          <div class="field"><label for="settings-interval">標準の区切り時間（分:秒）</label><input id="settings-interval" name="chapter_interval" type="text" pattern="[0-9]+:[0-5][0-9]" required></div>
        </div>
        <p class="modal-note">入力先と区切り時間は次に作成するジョブから使用します。出力ディレクトリはジョブ実行時に必要な階層を作成します。</p>
        <div class="button-row split"><button class="button ghost" type="button" data-action="close-settings">閉じる</button><button class="button" type="submit">保存</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <p class="eyebrow">CONFIRM</p>
        <h2 id="confirm-title">確認</h2>
        <p id="confirm-message"></p>
        <div class="button-row">
          <button type="button" data-action="close-confirm" data-value="cancel" class="button secondary">戻る</button>
          <button type="button" data-action="close-confirm" data-value="confirm" id="confirm-button" class="button danger">実行</button>
        </div>
      </form>
    </dialog>
  </div>
  <noscript>ChapterBrakeのWeb UIにはJavaScriptが必要です。</noscript>
</body>
</html>
