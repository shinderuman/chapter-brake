<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>ChapterBrake Web Bridge PoC</title>
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">CONNECTION PROOF</p>
        <h1>ChapterBrake</h1>
        <p class="subtitle">Unix socket bridge / read-only queue</p>
      </div>
      <div id="connection" class="connection pending" role="status">
        <span aria-hidden="true"></span>
        接続中
      </div>
    </header>
    <main>
      <section class="summary-grid" aria-label="現在の状態">
        <article>
          <span>バックエンド</span>
          <strong id="backend-status">確認中</strong>
        </article>
        <article>
          <span>キュー件数</span>
          <strong id="queue-count">—</strong>
        </article>
        <article>
          <span>実行状態</span>
          <strong id="run-state">—</strong>
        </article>
      </section>
      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">QUEUE.JSON</p>
            <h2>永続キュー（読み取り専用）</h2>
          </div>
          <button id="reload" type="button">再読込</button>
        </div>
        <div id="queue" class="queue" aria-live="polite"></div>
      </section>
      <section class="panel proof">
        <p class="eyebrow">PATH ROUND TRIP</p>
        <h2>日本語・空白・記号</h2>
        <code id="path-proof">確認中</code>
      </section>
      <section id="error-panel" class="error-panel" role="alert" hidden>
        <strong>バックエンドへ接続できません</strong>
        <span id="error-message"></span>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
